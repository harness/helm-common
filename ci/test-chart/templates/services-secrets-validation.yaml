{{/*
Validation-only harness for harness-common service-secret dependency checks.

Activated solely by `.Values.servicesSecretsValidation` so it never renders in
unrelated scenarios. Lets unit tests exercise each public entrypoint
(`renderServiceSecretsEnv` / `generateServiceExternalSecrets`) and each
dependency source (`.Values.serviceSecretDependencies` vs an explicit
`services` argument), proving validation fails when a declared dependency is
not defined under `global.services`.

  servicesSecretsValidation:
    mode: env | externalSecrets   # which entrypoint to invoke (default: env)
    services: []                  # optional explicit `services` arg (empty -> serviceSecretDependencies)
*/}}
{{- if .Values.servicesSecretsValidation }}
{{- $mode := .Values.servicesSecretsValidation.mode | default "env" }}
{{- $services := .Values.servicesSecretsValidation.services | default (list) }}
{{- if eq $mode "externalSecrets" }}
{{- include "harnesscommon.services.generateServiceExternalSecrets" (dict "ctx" $ "services" $services) }}
{{- else }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: services-validation-env-test
data:
  env: |
{{ include "harnesscommon.services.renderServiceSecretsEnv" (dict "ctx" $ "services" $services) | indent 4 }}
{{- end }}
{{- end }}
