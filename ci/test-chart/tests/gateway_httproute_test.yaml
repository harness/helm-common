suite: Gateway API HTTPRoute (harnesscommon.v2.renderHTTPRoute)
values:
  - ../values.yaml
  - ../ci-values/gateway-basic.yaml
templates:
  - ingress.yaml
release:
  name: harness-common-test
  namespace: default
tests:
  - it: first HTTPRoute should have correct metadata and spec
    documentSelector:
      path: spec.rules[0].backendRefs[0].name
      value: test-service
    asserts:
      - isKind:
          of: HTTPRoute
      - equal:
          path: apiVersion
          value: gateway.networking.k8s.io/v1
      - equal:
          path: metadata.name
          value: api-routes
      - equal:
          path: metadata.namespace
          value: default

  - it: first HTTPRoute should reference correct parent Gateway
    documentSelector:
      path: spec.rules[0].backendRefs[0].name
      value: test-service
    asserts:
      - equal:
          path: spec.parentRefs[0].name
          value: test-gateway
      - equal:
          path: spec.parentRefs[0].namespace
          value: gateway-system
      - equal:
          path: spec.parentRefs[0].sectionName
          value: https
      - equal:
          path: spec.parentRefs[0].port
          value: 443

  - it: first HTTPRoute should have correct hostnames
    documentSelector:
      path: spec.rules[0].backendRefs[0].name
      value: test-service
    asserts:
      - contains:
          path: spec.hostnames
          content: api.example.com
      - contains:
          path: spec.hostnames
          content: api-staging.example.com

  - it: first HTTPRoute backendRef.port uses the Service port, not the nginx targetPort
    # Bug 1 regression: Gateway API routes through the Service, so backendRef.port
    # must equal the Service spec.ports[].port (service.port: 8080 here) -- NOT the
    # nginx backend.service.port (4000, the pod/targetPort). A targetPort here yields
    # ResolvedRefs=False "TCP Port not found on Service" and 500s the route.
    documentSelector:
      path: spec.rules[0].backendRefs[0].name
      value: test-service
    asserts:
      - equal:
          path: spec.rules[0].matches[0].path.type
          value: RegularExpression
      - equal:
          path: spec.rules[0].matches[0].path.value
          value: /api(/|$)(.*)
      - equal:
          path: spec.rules[0].backendRefs[0].name
          value: test-service
      - equal:
          path: spec.rules[0].backendRefs[0].port
          value: 8080

  - it: second HTTPRoute backendRef.port uses the per-object gatewayAPI port override
    # worker-routes sets gatewayAPI.backend.service.port: 9090 to front a Service
    # whose port differs from the chart default; the nginx targetPort (4001) must
    # not leak into backendRef.port.
    documentSelector:
      path: spec.rules[0].backendRefs[0].name
      value: worker-service
    asserts:
      - isKind:
          of: HTTPRoute
      - equal:
          path: metadata.name
          value: worker-routes
      - equal:
          path: spec.rules[0].backendRefs[0].name
          value: worker-service
      - equal:
          path: spec.rules[0].backendRefs[0].port
          value: 9090
