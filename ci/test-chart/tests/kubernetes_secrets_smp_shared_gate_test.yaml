suite: smpSharedKubernetesSecrets is gated by global.sharedSecrets.enabled
templates:
  - kubernetes-secrets-test.yaml
release:
  name: harness-common-test
  namespace: default
tests:
  - it: ignores smpSharedKubernetesSecrets when global.sharedSecrets.enabled is false
    values:
      - ../values.yaml
      - ../ci-values/smp-shared-kubernetes-secrets-disabled.yaml
    documentSelector:
      path: metadata.name
      value: kubernetes-secrets-env-test
    asserts:
      - notMatchRegex:
          path: data.env
          pattern: "harness-shared-secrets"
      - notMatchRegex:
          path: data.env
          pattern: "SHARED_ONLY_VAR"
      - matchRegex:
          path: data.env
          pattern: "name: real-secret\\s+key: real-key"

  - it: ignores smpSharedKubernetesSecrets when global.sharedSecrets is not set (standalone chart)
    values:
      - ../values.yaml
      - ../ci-values/smp-shared-kubernetes-secrets-disabled.yaml
    set:
      global.sharedSecrets: null
    documentSelector:
      path: metadata.name
      value: kubernetes-secrets-env-test
    asserts:
      - notMatchRegex:
          path: data.env
          pattern: "harness-shared-secrets"

  - it: applies smpSharedKubernetesSecrets when global.sharedSecrets.enabled is true
    values:
      - ../values.yaml
      - ../ci-values/smp-shared-kubernetes-secrets-disabled.yaml
    set:
      global.sharedSecrets.enabled: true
    documentSelector:
      path: metadata.name
      value: kubernetes-secrets-env-test
    asserts:
      - matchRegex:
          path: data.env
          pattern: "name: harness-shared-secrets\\s+key: sharedOnlyKey"
      - matchRegex:
          path: data.env
          pattern: "name: harness-shared-secrets\\s+key: sharedKeyShouldNotApply"
