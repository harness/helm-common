suite: Gateway API cross-chart backend port (harnesscommon.v2.renderHTTPRoute)
values:
  - ../values.yaml
  - ../ci-values/gateway-cross-chart-backend.yaml
templates:
  - ingress.yaml
release:
  name: harness-common-test
  namespace: default
tests:
  - it: proxy HTTPRoute backendRef.port uses backend.service.port (9090), not service.port (7090)
    # Regression: when a path's backend.service.port (9090) differs from the chart's
    # own service.port (7090), backendRef.port must use 9090. Previously it fell
    # through to service.port, causing ResolvedRefs=False "TCP Port not found on Service".
    documentSelector:
      path: spec.rules[0].backendRefs[0].name
      value: other-service
    asserts:
      - isKind:
          of: HTTPRoute
      - equal:
          path: metadata.name
          value: proxy-route
      - equal:
          path: spec.rules[0].matches[0].path.value
          value: /proxy/api(/|$)(.*)
      - equal:
          path: spec.rules[0].backendRefs[0].port
          value: 9090

  - it: own-service HTTPRoute backendRef.port uses backend.service.port / service.port (7090)
    # When backend.service.port matches service.port, the correct port is still emitted.
    documentSelector:
      path: spec.rules[0].backendRefs[0].name
      value: test-service
    asserts:
      - isKind:
          of: HTTPRoute
      - equal:
          path: metadata.name
          value: own-route
      - equal:
          path: spec.rules[0].matches[0].path.value
          value: /api(/|$)(.*)
      - equal:
          path: spec.rules[0].backendRefs[0].port
          value: 7090
