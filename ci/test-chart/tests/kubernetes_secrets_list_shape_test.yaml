suite: Kubernetes Secrets - list shape regression (harnesscommon.renderSecretsAsEnvironmentVariables / renderSecretsAsVolumes)
values:
  - ../values.yaml
  - ../ci-values/kubernetes-secrets-list-shape.yaml
  - ../ci-values/kubernetes-secrets-list-shape-override.yaml
templates:
  - kubernetes-secrets-test.yaml
release:
  name: harness-common-test
  namespace: default
tests:
  - it: legacy list shape is unaffected by the map-shape support - override still replaces the whole list
    documentSelector:
      path: metadata.name
      value: kubernetes-secrets-env-test
    asserts:
      - matchRegex:
          path: data.env
          pattern: "name: HARNESS_JWT_SECRET"
      - matchRegex:
          path: data.env
          pattern: "name: harness-shared-secrets"
      - notMatchRegex:
          path: data.env
          pattern: "name: S3_ACCESS_KEY_ID"
      - notMatchRegex:
          path: data.env
          pattern: "name: STO_SERVICE_GLOBAL_TOKEN"
      - notMatchRegex:
          path: data.env
          pattern: "name: minio"

  - it: legacy list shape volumes are also replaced, not merged
    documentSelector:
      path: metadata.name
      value: kubernetes-secrets-volumes-test
    asserts:
      - notMatchRegex:
          path: data.volumes
          pattern: "name: minio"
      - notMatchRegex:
          path: data.volumes
          pattern: "name: harness-secrets"
