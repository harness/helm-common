suite: smpSharedKubernetesSecrets priority (harnesscommon.renderSecretsAsEnvironmentVariables)
values:
  - ../values.yaml
  - ../ci-values/smp-shared-kubernetes-secrets.yaml
templates:
  - kubernetes-secrets-test.yaml
release:
  name: harness-common-test
  namespace: default
tests:
  - it: renders a variable that only exists in smpSharedKubernetesSecrets
    documentSelector:
      path: metadata.name
      value: kubernetes-secrets-env-test
    asserts:
      - matchRegex:
          path: data.env
          pattern: "name: harness-shared-secrets\\s+key: sharedOnlyKey"

  - it: lets a real kubernetesSecrets entry win over smpSharedKubernetesSecrets on conflict
    documentSelector:
      path: metadata.name
      value: kubernetes-secrets-env-test
    asserts:
      - matchRegex:
          path: data.env
          pattern: "name: real-secret\\s+key: real-key"
      - notMatchRegex:
          path: data.env
          pattern: "key: sharedKeyShouldLose"

  - it: ignores a blank kubernetesSecrets placeholder in favor of smpSharedKubernetesSecrets
    documentSelector:
      path: metadata.name
      value: kubernetes-secrets-env-test
    asserts:
      - matchRegex:
          path: data.env
          pattern: "name: harness-shared-secrets\\s+key: sharedKeyShouldWin"

  - it: still lets ESO win over smpSharedKubernetesSecrets
    documentSelector:
      path: metadata.name
      value: kubernetes-secrets-env-test
    asserts:
      - matchRegex:
          path: data.env
          pattern: "name: harness-common-test-ext-secret-0\\s+key: ESO_VAR"
      - notMatchRegex:
          path: data.env
          pattern: "key: sharedKeyShouldLoseToESO"
