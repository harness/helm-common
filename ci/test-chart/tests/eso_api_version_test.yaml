suite: DB ExternalSecret apiVersion is opt-in
templates:
  - eso-db-externalsecret-test.yaml
release:
  name: harness-common-test
  namespace: default
tests:
  - it: DB ExternalSecrets default to v1beta1
    values:
      - ../values.yaml
      - ../ci-values/eso-db-api-version.yaml
    asserts:
      - equal:
          path: apiVersion
          value: external-secrets.io/v1beta1
        documentIndex: 0
      - equal:
          path: apiVersion
          value: external-secrets.io/v1beta1
        documentIndex: 1

  - it: DB ExternalSecrets follow global.externalSecrets.apiVersion
    values:
      - ../values.yaml
      - ../ci-values/eso-db-api-version.yaml
    set:
      global.externalSecrets.apiVersion: v1
    asserts:
      - equal:
          path: apiVersion
          value: external-secrets.io/v1
        documentIndex: 0
      - equal:
          path: apiVersion
          value: external-secrets.io/v1
        documentIndex: 1
