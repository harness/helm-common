suite: smpSharedKubernetesSecrets isolation from a customer kubernetesSecrets override
values:
  - ../values.yaml
  - ../ci-values/smp-shared-kubernetes-secrets.yaml
  - ../ci-values/smp-shared-kubernetes-secrets-customer-override.yaml
templates:
  - kubernetes-secrets-test.yaml
release:
  name: harness-common-test
  namespace: default
tests:
  # The customer's kubernetesSecrets entry replaces the whole list (normal Helm
  # list-replacement semantics) - real-secret is gone. Expected, not a regression.
  - it: replaces the prior kubernetesSecrets list per normal Helm semantics
    documentSelector:
      path: metadata.name
      value: kubernetes-secrets-env-test
    asserts:
      - notMatchRegex:
          path: data.env
          pattern: "name: real-secret"

  - it: renders the customer's own unrelated kubernetesSecrets entry
    documentSelector:
      path: metadata.name
      value: kubernetes-secrets-env-test
    asserts:
      - matchRegex:
          path: data.env
          pattern: "name: customer-secret\\s+key: customerKey"

  # Core guarantee: smpSharedKubernetesSecrets is a separate key, so it survives an
  # unrelated customer override to kubernetesSecrets untouched.
  - it: keeps smpSharedKubernetesSecrets variables intact despite the unrelated override
    documentSelector:
      path: metadata.name
      value: kubernetes-secrets-env-test
    asserts:
      - matchRegex:
          path: data.env
          pattern: "name: harness-shared-secrets\\s+key: sharedOnlyKey"
