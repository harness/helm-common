suite: Gateway API TCPRoute (harnesscommon.v2.renderTCPRoute)
values:
  - ../values.yaml
  - ../ci-values/gateway-tcproute.yaml
templates:
  - ingress.yaml
release:
  name: harness-common-test
  namespace: default
tests:
  - it: should render TCPRoute with correct kind and apiVersion
    documentSelector:
      path: spec.rules[0].backendRefs[0].name
      value: postgres-svc
    asserts:
      - isKind:
          of: TCPRoute
      - equal:
          path: apiVersion
          value: gateway.networking.k8s.io/v1alpha2

  - it: should have correct metadata for postgres route
    documentSelector:
      path: spec.rules[0].backendRefs[0].name
      value: postgres-svc
    asserts:
      - equal:
          path: metadata.name
          value: postgres-route
      - equal:
          path: metadata.namespace
          value: default

  - it: should reference parent gateway with local sectionName override
    documentSelector:
      path: spec.rules[0].backendRefs[0].name
      value: postgres-svc
    asserts:
      - equal:
          path: spec.parentRefs[0].name
          value: test-gateway
      - equal:
          path: spec.parentRefs[0].namespace
          value: gateway-system
      - equal:
          path: spec.parentRefs[0].sectionName
          value: tcp-5432
      - equal:
          path: spec.parentRefs[0].port
          value: 5432

  - it: should have correct backend ref for postgres
    documentSelector:
      path: spec.rules[0].backendRefs[0].name
      value: postgres-svc
    asserts:
      - equal:
          path: spec.rules[0].backendRefs[0].name
          value: postgres-svc
      - equal:
          path: spec.rules[0].backendRefs[0].port
          value: 5432

  - it: should render redis route with weighted backends
    documentSelector:
      path: spec.rules[0].backendRefs[0].name
      value: redis-svc
    asserts:
      - isKind:
          of: TCPRoute
      - equal:
          path: metadata.name
          value: redis-route
      - equal:
          path: spec.rules[0].backendRefs[0].weight
          value: 80
      - equal:
          path: spec.rules[0].backendRefs[1].name
          value: redis-replica-svc
      - equal:
          path: spec.rules[0].backendRefs[1].weight
          value: 20
