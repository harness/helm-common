suite: ESO ExternalSecret (harnesscommon.secrets.generateExternalSecret)
templates:
  - eso-secret-test.yaml
release:
  name: harness-common-test
  namespace: default
tests:
  - it: should render version (quoted) when remoteKey has version
    values:
      - ../values.yaml
      - ../ci-values/eso-secret-version.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ExternalSecret
      - contains:
          path: spec.data
          content:
            secretKey: app_cert
            remoteRef:
              key: REMOTE_CERT
              version: "1"
      - contains:
          path: spec.data
          content:
            secretKey: app_key
            remoteRef:
              key: REMOTE_KEY
              version: "1"
      - contains:
          path: spec.data
          content:
            secretKey: app_secret_a
            remoteRef:
              key: REMOTE_SECRET_A
              property: REMOTE_PROPERTY_A
      - contains:
          path: spec.data
          content:
            secretKey: app_token_a
            remoteRef:
              key: REMOTE_TOKEN_A

  - it: should quote unquoted string version (e.g. latest)
    values:
      - ../values.yaml
      - ../ci-values/eso-secret-version-string.yaml
    asserts:
      - equal:
          path: spec.data
          value:
            - secretKey: app_cert
              remoteRef:
                key: REMOTE_CERT
                version: "latest"

  - it: should quote bare integer version
    values:
      - ../values.yaml
      - ../ci-values/eso-secret-version-int.yaml
    asserts:
      - equal:
          path: spec.data
          value:
            - secretKey: app_cert
              remoteRef:
                key: REMOTE_CERT
                version: "1"

  - it: should not render version when remoteKey has no version
    values:
      - ../values.yaml
      - ../ci-values/eso-secret-no-version.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ExternalSecret
      - equal:
          path: spec.data
          value:
            - secretKey: app_secret_a
              remoteRef:
                key: REMOTE_SECRET_A
                property: REMOTE_PROPERTY_A
            - secretKey: app_token_a
              remoteRef:
                key: REMOTE_TOKEN_A
            - secretKey: app_webhook
              remoteRef:
                key: REMOTE_WEBHOOK
