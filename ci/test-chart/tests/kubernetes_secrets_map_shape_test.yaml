suite: Kubernetes Secrets - map shape deep-merge (harnesscommon.renderSecretsAsEnvironmentVariables / renderSecretsAsVolumes)
values:
  - ../values.yaml
  - ../ci-values/kubernetes-secrets-map-shape.yaml
  - ../ci-values/kubernetes-secrets-map-shape-override.yaml
templates:
  - kubernetes-secrets-test.yaml
release:
  name: harness-common-test
  namespace: default
tests:
  # S3_ACCESS_KEY_ID and STO_SERVICE_GLOBAL_TOKEN are also listed under fileSecret in the
  # ci-values, so renderSecretsAsEnvironmentVariables correctly excludes them here (they're
  # file-mounted instead, asserted below) -- only S3_ACCESS_SECRET_KEY (native "minio") and
  # HARNESS_JWT_SECRET (override "harness-shared-secrets") are expected as plain env vars.
  - it: deep-merges the override entry with a chart-native entry instead of replacing it (env vars)
    documentSelector:
      path: metadata.name
      value: kubernetes-secrets-env-test
    asserts:
      - matchRegex:
          path: data.env
          pattern: "name: HARNESS_JWT_SECRET"
      - matchRegex:
          path: data.env
          pattern: "name: S3_ACCESS_SECRET_KEY"
      - notMatchRegex:
          path: data.env
          pattern: "name: S3_ACCESS_KEY_ID"
      - notMatchRegex:
          path: data.env
          pattern: "name: STO_SERVICE_GLOBAL_TOKEN"

  - it: renders correct secretKeyRef name (map key = secretName) and key for each env-var source
    documentSelector:
      path: metadata.name
      value: kubernetes-secrets-env-test
    asserts:
      - matchRegex:
          path: data.env
          pattern: "name: harness-shared-secrets\\s+key: jwtNextGenManagerSecret"
      - matchRegex:
          path: data.env
          pattern: "name: minio\\s+key: root-password"

  # The file-mounted keys (S3_ACCESS_KEY_ID from native "minio", STO_SERVICE_GLOBAL_TOKEN from
  # native "harness-secrets") prove the merge holds for the volumes path too -- both chart-native
  # entries survive alongside the override entry in the same merged secrets.kubernetesSecrets map.
  - it: renders projected volumes with all merged chart-native secret sources for fileSecret
    documentSelector:
      path: metadata.name
      value: kubernetes-secrets-volumes-test
    asserts:
      - matchRegex:
          path: data.volumes
          pattern: "name: minio"
      - matchRegex:
          path: data.volumes
          pattern: "name: harness-secrets"
      - matchRegex:
          path: data.volumes
          pattern: "key: root-user"
      - matchRegex:
          path: data.volumes
          pattern: "key: stoAppHarnessToken"
