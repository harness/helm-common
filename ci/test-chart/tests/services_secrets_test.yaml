suite: Service Secrets (harnesscommon.services.renderServiceSecretsEnv)
values:
  - ../values.yaml
  - ../ci-values/services-secrets.yaml
templates:
  - services-secrets.yaml
release:
  name: harness-common-test
  namespace: default
tests:
  - it: should render ConfigMap with env for declared dependency (resourceHierarchy)
    documentSelector:
      path: metadata.name
      value: services-env-test
    asserts:
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: data.env
          pattern: "RESOURCE_HIERARCHY_SERVICE_SECRET"

  - it: should generate ExternalSecret for declared dependency
    asserts:
      - containsDocument:
          kind: ExternalSecret
          apiVersion: external-secrets.io/v1beta1
          any: true

  - it: should NOT render env for non-dependency service (pipeline)
    documentSelector:
      path: metadata.name
      value: services-env-test
    asserts:
      - notMatchRegex:
          path: data.env
          pattern: "PIPELINE_SERVICE_SECRET"

  - it: should NOT render env for disabled service
    documentSelector:
      path: metadata.name
      value: services-env-test
    asserts:
      - notMatchRegex:
          path: data.env
          pattern: "SHOULD_NOT_RENDER"

---

# Missing dependency declared via .Values.serviceSecretDependencies.
# This is how a consuming chart opts in (chart overrides set the list), so when
# an entry is not defined under global.services the render must hard-fail.
suite: Service Secrets - missing serviceSecretDependencies should fail
values:
  - ../values.yaml
  - ../ci-values/services-secrets-missing-dep.yaml
templates:
  - services-secrets.yaml
release:
  name: harness-common-test
  namespace: default
tests:
  - it: renderServiceSecretsEnv should fail when a declared dependency is not defined under global.services
    asserts:
      - failedTemplate:
          errorMessage: "serviceSecretDependencies: dependency 'nonExistentService' is not defined under global.services"

---

# Missing dependency passed via the explicit `services` argument (the form used
# when a chart calls these helpers directly in its own templates). global.services
# only defines resourceHierarchy, so requesting an undefined service must fail for
# BOTH public entrypoints. Uses the valid values file so the validation harness is
# the only thing that can fail.
suite: Service Secrets - missing dependency via explicit services arg should fail
values:
  - ../values.yaml
  - ../ci-values/services-secrets.yaml
templates:
  - services-secrets-validation.yaml
release:
  name: harness-common-test
  namespace: default
tests:
  - it: renderServiceSecretsEnv should fail for an undefined service passed via the services arg
    set:
      servicesSecretsValidation:
        mode: env
        services:
          - nonExistentService
    asserts:
      - failedTemplate:
          errorMessage: "serviceSecretDependencies: dependency 'nonExistentService' is not defined under global.services"

  - it: generateServiceExternalSecrets should fail for an undefined service passed via the services arg
    set:
      servicesSecretsValidation:
        mode: externalSecrets
        services:
          - nonExistentService
    asserts:
      - failedTemplate:
          errorMessage: "serviceSecretDependencies: dependency 'nonExistentService' is not defined under global.services"

---

# Guard against false positives: a dependency that IS defined under global.services
# must never trip the validation, for either entrypoint.
suite: Service Secrets - valid dependencies should NOT fail
values:
  - ../values.yaml
  - ../ci-values/services-secrets.yaml
templates:
  - services-secrets-validation.yaml
release:
  name: harness-common-test
  namespace: default
tests:
  - it: renderServiceSecretsEnv should not fail when the explicit services arg only references defined services
    set:
      servicesSecretsValidation:
        mode: env
        services:
          - resourceHierarchy
    asserts:
      - notFailedTemplate: {}
      - matchRegex:
          path: data.env
          pattern: "RESOURCE_HIERARCHY_SERVICE_SECRET"

  - it: generateServiceExternalSecrets should not fail when the explicit services arg only references defined services
    set:
      servicesSecretsValidation:
        mode: externalSecrets
        services:
          - resourceHierarchy
    asserts:
      - notFailedTemplate: {}
      - containsDocument:
          kind: ExternalSecret
          apiVersion: external-secrets.io/v1beta1
          any: true
