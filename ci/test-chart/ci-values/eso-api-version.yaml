esoTest: true
secrets:
  secretManagement:
    externalSecretsOperator:
      - secretStore: {name: store, kind: ClusterSecretStore}
        remoteKeys:
          MY_VAR: {name: remote/path}
database:
  mongo:
    app:
      enabled: true
      secrets:
        secretManagement:
          externalSecretsOperator:
            - secretStore: {name: store, kind: ClusterSecretStore}
              remoteKeys:
                MONGO_PASSWORD: {name: remote/mongo}
