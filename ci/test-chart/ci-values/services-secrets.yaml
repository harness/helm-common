# Only resourceHierarchy is a declared dependency: pipeline (a defined but
# non-dependency service) must NOT be rendered, proving the filter works.
serviceSecretDependencies:
  - resourceHierarchy
global:
  services:
    resourceHierarchy:
      ctxIdentifier: resource-hierarchy-service
      secrets:
        kubernetesSecrets: []
        secretManagement:
          externalSecretsOperator:
            - secretStore:
                name: my-store
                kind: ClusterSecretStore
              remoteKeys:
                RESOURCE_HIERARCHY_SERVICE_SECRET:
                  name: rhs/secret
                  property: token
    pipeline:
      secrets:
        kubernetesSecrets:
          - secretName: pipeline-k8s-secret
            keys:
              PIPELINE_SERVICE_SECRET: pipeline-secret-key
        secretManagement:
          externalSecretsOperator: []
    disabledService:
      enabled: false
      secrets:
        secretManagement:
          externalSecretsOperator:
            - secretStore:
                name: my-store
                kind: ClusterSecretStore
              remoteKeys:
                SHOULD_NOT_RENDER:
                  name: nope/secret
