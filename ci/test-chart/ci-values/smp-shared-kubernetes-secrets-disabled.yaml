global:
  sharedSecrets:
    enabled: false
secrets:
  default:
    DEFAULT_VAR: defaultKey
  kubernetesSecrets:
    - secretName: real-secret
      keys:
        REAL_VAR: real-key
  smpSharedKubernetesSecrets:
    - secretName: harness-shared-secrets
      keys:
        SHARED_ONLY_VAR: sharedOnlyKey
        REAL_VAR: sharedKeyShouldLose
        DEFAULT_VAR: sharedKeyShouldNotApply
  secretManagement:
    externalSecretsOperator: []
  fileSecret: []
