secrets:
  secretManagement:
    externalSecretsOperator:
      - secretStore:
          name: "shared"
          kind: "ClusterSecretStore"
        remoteKeys:
          APP_SECRET_A:
            name: "REMOTE_SECRET_A"
            property: "REMOTE_PROPERTY_A"
          APP_CERT:
            name: "REMOTE_CERT"
            version: "1"
            property: ""
          APP_KEY:
            name: "REMOTE_KEY"
            version: "1"
            property: ""
          APP_TOKEN_A:
            name: "REMOTE_TOKEN_A"
            property: ""
          APP_WEBHOOK:
            name: "REMOTE_WEBHOOK"
            property: ""
          APP_TOKEN_B:
            name: "REMOTE_TOKEN_B"
            property: ""
          APP_ACCOUNT_ID:
            name: "REMOTE_ACCOUNT_ID"
            property: ""
