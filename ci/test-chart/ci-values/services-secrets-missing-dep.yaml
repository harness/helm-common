# Declares a dependency on "nonExistentService" which is NOT defined under
# global.services. Template rendering must fail with a descriptive error.
serviceSecretDependencies:
  - nonExistentService
global:
  services:
    resourceHierarchy:
      ctxIdentifier: resource-hierarchy-service
      secrets:
        kubernetesSecrets: []
        secretManagement:
          externalSecretsOperator:
            - secretStore:
                name: my-store
                kind: ClusterSecretStore
              remoteKeys:
                RESOURCE_HIERARCHY_SERVICE_SECRET:
                  name: rhs/secret
                  property: token
