# Scenario: secrets.kubernetesSecrets override LAYER (MAP shape), e.g. override-secrets.yaml
# after migration. Applied as a second -f on top of kubernetes-secrets-map-shape.yaml. Because
# maps are deep-merged by Helm (unlike lists), this layer ADDS the "harness-shared-secrets"
# entry alongside the base layer's "minio"/"harness-secrets" entries instead of replacing them.
secrets:
  kubernetesSecrets:
    harness-shared-secrets:
      keys:
        HARNESS_JWT_SECRET: "jwtNextGenManagerSecret"
