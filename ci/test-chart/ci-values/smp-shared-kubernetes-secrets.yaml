secrets:
  default: {}
  kubernetesSecrets:
    - secretName: real-secret
      keys:
        REAL_VAR: real-key
    - secretName: ""
      keys:
        BLANK_VAR: ""
  smpSharedKubernetesSecrets:
    - secretName: harness-shared-secrets
      keys:
        SHARED_ONLY_VAR: sharedOnlyKey
        REAL_VAR: sharedKeyShouldLose
        BLANK_VAR: sharedKeyShouldWin
        ESO_VAR: sharedKeyShouldLoseToESO
  secretManagement:
    externalSecretsOperator:
      - secretStore:
          name: my-store
          kind: SecretStore
        remoteKeys:
          ESO_VAR:
            name: remote-eso-name
            property: some-property
  fileSecret: []
