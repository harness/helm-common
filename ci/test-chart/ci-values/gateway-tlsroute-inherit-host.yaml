global:
  ingress:
    enabled: true
    hosts:
      - tls.example.com
      - "*.tls.example.com"

  gatewayAPI:
    enabled: true
    parentRef:
      name: test-gateway
      namespace: gateway-system

ingress:
  tlsRoutes:
    - name: db-passthrough-inherit
      parentRef:
        sectionName: tls-passthrough
      rules:
        - backendRefs:
            - name: db-svc
              port: 5432

service:
  port: 8080
