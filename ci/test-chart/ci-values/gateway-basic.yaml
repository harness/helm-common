# Basic Gateway API HTTPRoute test
global:
  ingress:
    enabled: true
    hosts:
      - api.example.com
      - api-staging.example.com

  gatewayAPI:
    enabled: true
    parentRef:
      name: test-gateway
      namespace: gateway-system
      sectionName: https
      port: 443

ingress:
  objects:
    # api-routes: no backend.service.port set on the path, so the HTTPRoute
    # backendRef.port falls back to the chart's Service port (service.port: 8080).
    - name: api-routes
      paths:
        - path: /api(/|$)(.*)
          backend:
            service:
              name: test-service

    # worker-routes: uses a per-object gatewayAPI.backend.service.port override (9090)
    # to front a service whose Service port differs from the chart default.
    - name: worker-routes
      gatewayAPI:
        backend:
          service:
            port: 9090
      paths:
        - path: /worker/.*
          backend:
            service:
              name: worker-service

service:
  port: 8080
