secrets:
  secretManagement:
    externalSecretsOperator:
      - secretStore:
          name: "shared"
          kind: "ClusterSecretStore"
        remoteKeys:
          APP_SECRET_A:
            name: "REMOTE_SECRET_A"
            property: "REMOTE_PROPERTY_A"
          APP_TOKEN_A:
            name: "REMOTE_TOKEN_A"
            property: ""
          APP_WEBHOOK:
            name: "REMOTE_WEBHOOK"
            property: ""
