# Scenario: secrets.kubernetesSecrets override LAYER (LIST shape), e.g. override-secrets.yaml.
# Applied as a second -f on top of kubernetes-secrets-list-shape.yaml. Because Helm replaces
# (never merges) list values across -f layers, this whole list REPLACES the chart's native
# entries -- the "minio"/"harness-secrets" entries from the base layer disappear entirely.
# This is the known, documented limitation for charts still on the legacy list shape.
secrets:
  kubernetesSecrets:
    - secretName: "harness-shared-secrets"
      keys:
        HARNESS_JWT_SECRET: "jwtNextGenManagerSecret"
