# Scenario: secrets.kubernetesSecrets as the new MAP shape, keyed by secretName ("chart
# defaults" layer). Same native entries as kubernetes-secrets-list-shape.yaml, just expressed
# as a map instead of a list -- this is what a chart's own values.yaml looks like after
# migrating to the map shape.
secrets:
  default: {}
  kubernetesSecrets:
    minio:
      keys:
        S3_ACCESS_KEY_ID: "root-user"
        S3_ACCESS_SECRET_KEY: "root-password"
    harness-secrets:
      keys:
        STO_SERVICE_GLOBAL_TOKEN: "stoAppHarnessToken"
  secretManagement:
    externalSecretsOperator: []
  fileSecret:
    - volumeMountPath: /etc/secrets
      keys:
        - key: S3_ACCESS_KEY_ID
        - key: STO_SERVICE_GLOBAL_TOKEN
