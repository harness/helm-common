# Scenario: secrets.kubernetesSecrets as the legacy LIST shape ("chart defaults" layer).
# Mirrors a real chart's own values.yaml, e.g. ssca/component-analysis-service: a native
# "minio" entry (real external infra credentials) plus a "harness-secrets" entry.
# Pair with kubernetes-secrets-list-shape-override.yaml as a second -f layer to reproduce
# the known Helm list-replacement limitation for charts that have NOT migrated to map shape.
secrets:
  default: {}
  kubernetesSecrets:
    - secretName: "minio"
      keys:
        S3_ACCESS_KEY_ID: "root-user"
        S3_ACCESS_SECRET_KEY: "root-password"
    - secretName: "harness-secrets"
      keys:
        STO_SERVICE_GLOBAL_TOKEN: "stoAppHarnessToken"
  secretManagement:
    externalSecretsOperator: []
  fileSecret:
    - volumeMountPath: /etc/secrets
      keys:
        - key: S3_ACCESS_KEY_ID
        - key: STO_SERVICE_GLOBAL_TOKEN
