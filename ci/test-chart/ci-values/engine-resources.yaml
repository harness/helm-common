# Scenario: Harness Engine Schedule CRs (requires --api-versions engine.harness.io/v1alpha1/Schedule)
engineResources:
  schedules:
    nightly-cleanup:
      spec:
        namespace: pipeline
        cronExpr: "0 3 * * *"
        invocation:
          queue: pipeline
          action: cleanup
    legacy-sync:
      enabled: false
      spec:
        namespace: pipeline
        cronExpr: "0 * * * *"
        invocation:
          queue: pipeline
          action: sync
