global:
  ha: false
  gatewayAPI:
    # Enable GatewayAPI HTTPRoute generation (requires global.ingress.enabled)
    enabled: false
    # Default parent Gateway reference for all HTTPRoutes
    parentRef:
      name: ""
      namespace: ""
      sectionName: ""
      port:

    # Shared/default Envoy Gateway policies (Option C: Hybrid - shared defaults + per-route overrides)
    policies:
      # BackendTrafficPolicy - backend timeouts, connection settings, protocol, and more
      # These settings apply to traffic from Gateway to backend Services
      # Full API reference: https://gateway.envoyproxy.io/docs/api/extension_types#backendtrafficpolicy
      backendTraffic:
        enabled: false

        # All Envoy Gateway BackendTrafficPolicy spec fields are supported.
        # Below are common examples. See API docs for complete list of fields:
        # https://gateway.envoyproxy.io/docs/api/extension_types#backendtrafficpolicyspec

        # Timeouts for backend connections
        # timeout:
        #   http:
        #     requestTimeout: "300s"           # Max time for complete request/response
        #     connectionIdleTimeout: "3600s"   # Idle connection timeout
        #   tcp:
        #     connectTimeout: "30s"            # Connection establishment timeout

        # Backend connection settings
        # connection:
        #   bufferLimit: "10Gi"                # Max request/response buffer size

        # Backend protocol (HTTP, GRPC, H2C)
        # protocol: "GRPC"

        # Use client protocol (HTTP/1.1 or HTTP/2) for upstream connections
        # Set to false to force HTTP/2 upstream (per-route override only)
        # useClientProtocol: false

        # Load balancing policy
        # loadBalancer:
        #   type: "LeastRequest"               # RoundRobin, LeastRequest, Random, Maglev, ConsistentHash

        # Retry policy
        # retry:
        #   numRetries: 3
        #   perRetryTimeout: "5s"
        #   retryOn:
        #     triggers:
        #       - "5xx"
        #       - "reset"
        #     httpStatusCodes:
        #       - 502
        #       - 503

        # Circuit breaker settings
        # circuitBreaker:
        #   maxConnections: 1024               # Max connections to backend
        #   maxPendingRequests: 1024           # Max pending requests
        #   maxParallelRequests: 1024          # Max parallel requests
        #   maxRequestsPerConnection: 1        # Max requests per connection (0 = unlimited)

        # Active health checking
        # healthCheck:
        #   active:
        #     timeout: "1s"
        #     interval: "5s"
        #     unhealthyThreshold: 3
        #     healthyThreshold: 1
        #     type: "HTTP"
        #     http:
        #       path: "/health"
        #       expectedStatuses:
        #         - 200

        # TCP keepalive settings
        # tcpKeepalive:
        #   probes: 3
        #   interval: "30s"
        #   idleTime: "300s"

        # HTTP/2 settings for backend connections
        # http2:
        #   maxConcurrentStreams: 100
        #   initialStreamWindowSize: "64Ki"
        #   initialConnectionWindowSize: "1Mi"

        # DNS resolution settings
        # dns:
        #   respectDnsTtl: true
        #   dnsRefreshRate: "30s"

        # Proxy protocol (v1 or v2)
        # proxyProtocol:
        #   version: "V2"

        # Rate limiting
        # rateLimit:
        #   type: "Local"
        #   local:
        #     rules:
        #       - limit:
        #           requests: 100
        #           unit: "Second"

        # Fault injection for testing
        # faultInjection:
        #   delay:
        #     fixedDelay: "5s"
        #     percentage: 10.0
        #   abort:
        #     httpStatus: 503
        #     percentage: 5.0

        # Response compression
        # compressor:
        #   - type: "Gzip"
        #   - type: "Brotli"

      # ClientTrafficPolicy - client-side settings (attaches to Gateway, not individual routes)
      # These settings apply to traffic from clients to the Gateway
      clientTraffic:
        enabled: false
        # Client-side connection limits
        connection:
          # e.g., "1024Mi" - equivalent to nginx proxy-body-size
          bufferLimit: ""
        # Client-side timeouts
        timeout:
          http:
            # e.g., "3600s"
            idleTimeout: ""
            # e.g., "3600s" - equivalent to nginx client_body_timeout
            requestReceivedTimeout: ""
        # HTTP/2 settings
        http2:
          maxConcurrentStreams: 0

      # SecurityPolicy - IP whitelisting, CORS, JWT, etc.
      security:
        enabled: false
        # IP-based authorization
        authorization:
          # "Allow" or "Deny"
          defaultAction: ""
          rules: []
            # Example:
            # - action: "Allow"
            #   principal:
            #     clientCIDRs:
            #       - "10.0.0.0/8"
            #       - "192.168.1.0/24"
        # CORS policy
        cors:
          allowOrigins: []
          allowMethods: []
          allowHeaders: []
          exposeHeaders: []
          maxAge: ""
        # JWT authentication
        jwt:
          providers: []

    # HTTPRoute-level shared defaults
    httpRoute:
      # Request header manipulation - applies to all routes unless overridden
      requestHeaders:
        set: []
          # - name: "X-Custom-Header"
          #   value: "value"
        add: []
        remove: []

      # Response header manipulation - applies to all routes unless overridden
      responseHeaders:
        set: []
        add: []
        remove: []

      # Upstream host override - equivalent to nginx upstream-vhost
      # e.g., "app.example.io"
      upstreamHostOverride: ""

      # Additional hostnames (server aliases) - equivalent to nginx server-alias
      # Note: Gateway API supports wildcards but not regex patterns
      additionalHostnames: []
        # - "*.alias.example.io"
        # - "alias-staging.example.io"
  # Used by nginx ingress and gateway-api -- both templates can be
  # used in tandem allowing for swapping between what is being used
  # by changing target destination in global gateway.
  ingress:
    enabled: false
    # List of hostnames for HTTPRoute/nginx
    hosts: []
    # Set to true to use wildcard "*" hostname instead of specific hosts
    disableHostInIngress: false
    objects:
      # Annotations to apply to all nginx ingress/HTTPRoute objects
      annotations: {}
      gatewayPolicies: {}
  # Common labels applied to all resources
  commonLabels: {}
  # Common annotations applied to all resources
  commonAnnotations: {}
  cet:
    # Global Settings/Enabling of Error Tracking Agent
    # Note: These are for Enabling the Agent with Harness Services
    agent:
      enabled: false
      collectorURL: ""
  externalSecretsLoader:
    enabled: false
    provider: "vault"
    image:
      repository: "repo/image"
      tag: "tag"
      pullPolicy: "IfNotPresent"
    vault:
      address: ""
      engine: ""
      basePath: ""
      tlsDisabled: false
      caCert:
        enabled: false
        secretName: ""
        secretKey: "ca.crt"
      auth:
        method: "token"
        # For Token auth:
        token: "vault-token"
        # For AppRole:
        roleId: ""
        secretId: ""
        # For Kubernetes auth:
        role: ""
    databases:
      mongo:
        useDatabaseSecretsEngine: false
        engine: ""
        overridePath: ""
        databaseRole: ""
      redis:
        useDatabaseSecretsEngine: false
        engine: ""
        overridePath: ""
        databaseRole: ""
      postgres:
        useDatabaseSecretsEngine: false
        engine: ""
        basePath: ""
        databaseRole: ""
  database:
    postgres:
      ## - installed = true if installed within cluster
      installed: true
      ## - protocol to use for connection
      protocol: postgres
      ## - host array for external
      hosts:
        - postgres:5432
      ## - secret name containing external values
      secretName: ""
      ## - key within secret containing username
      userKey: ""
      ## - key within secret containing password
      passwordKey: ""
      ## - extra arguments set to connection string
      extraArgs: ""
    mongo:
      installed: true
      databasePrefix: ""
      protocol: mongodb
      hosts: []
      secretName: ""
      userKey: ""
      passwordKey: ""
      extraArgs: ""
    timescaledb:
      installed: true
      protocol: "jdbc:postgresql"
      hosts:
        - timescaledb-single-chart:5432
      secretName: ""
      userKey: ""
      passwordKey: ""
      extraArgs: ""
    redis:
      installed: true
      protocol: "redis"
      hosts:
      - "redis:6379"
      secretName: "secret"
      userKey: "user"
      passwordKey: "password"
      extraArgs: ""
  # Service-to-service secrets configuration
  # Automatically injects secrets for inter-service communication
  services:
    # Resource Hierarchy Service secrets
    resourceHierarchy:
      enabled: true
      secrets:
        kubernetesSecrets:
          - secretName: ""
            keys:
              RESOURCE_HIERARCHY_SERVICE_SECRET: ""
        secretManagement:
          externalSecretsOperator:
            - secretStore:
                name: ""
                kind: ""
              remoteKeys:
                RESOURCE_HIERARCHY_SERVICE_SECRET:
                  name: ""
                  property: ""
  smtpCreateSecret:
    enabled: false
    SMTP_USERNAME: ""
    SMTP_PASSWORD: ""
    SMTP_HOST: ""
    SMTP_USE_SSL: "true"
    SMTP_PORT: "465"
    secrets:
      kubernetesSecrets:
        - secretName: ""
          keys:
            SMTP_USERNAME: ""
            SMTP_PASSWORD": ""
            SMTP_HOST: ""
            SMTP_PORT": ""
            SMTP_USE_SSL": ""
      secretManagement:
        externalSecretsOperator:
          - secretStore:
              name: ""
              kind: ""
            remoteKeys:
              SMTP_USERNAME:
                name: ""
                property: ""
              SMTP_PASSWORD":
                name: ""
                property: ""
              SMTP_HOST:
                name: ""
                property: ""
              SMTP_PORT":
                name: ""
                property: ""
              SMTP_USE_SSL:
                name: ""
                property: ""

# KEDA (Kubernetes Event-driven Autoscaling). See docs/KEDA.md.
# Consuming charts set keda.enabled and keda.scaledObject (and optionally triggerAuthentication).
keda:
  enabled: false
  scaledObject:
    # minReplicaCount: 0
    # maxReplicaCount: 100
    # pollingInterval: 30
    # cooldownPeriod: 300
    # triggers: []   # required when enabled — list of KEDA trigger specs
    # fallback: {}   # optional
    # advanced: {}  # optional (e.g. horizontalPodAutoscalerConfig.behavior)
  triggerAuthentication:
    create: false
    # name: ""
    # spec: {}   # passthrough: podIdentity, secretTargetRef, env, etc.
